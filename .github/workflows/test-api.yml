# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build and Test API project

on:
  pull_request:
    branches: [ "main" ]
  push:
      branches: [ "main" ]

env:
  GAME_PROJECT: src/NonoSharp/NonoSharp.csproj
  TEST_PROJECT: tests/NonoSharp.Tests/NonoSharp.Tests.csproj

jobs:
  build-and-test-api:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: |-
        dotnet restore ${{ env.GAME_PROJECT }}
        dotnet restore ${{ env.TEST_PROJECT }}
    - name: Build API project
      run: dotnet build -c Release --no-restore ${{ env.GAME_PROJECT }}
    - name: Build Test project
      run: dotnet build -c Release --no-restore ${{ env.TEST_PROJECT }}
    - name: Test
      run: dotnet test -c Release --no-build --verbosity normal ${{ env.TEST_PROJECT }}