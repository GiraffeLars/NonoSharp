name: Check code style
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
    code-style:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                dotnet-version: 10.0.x
            
            - name: Check formatting
              run: |
                dotnet format src/NonoSharp/NonoSharp.csproj --verify-no-changes --severity info
                dotnet format tests/NonoSharp.Tests/NonoSharp.Tests.csproj --verify-no-changes
