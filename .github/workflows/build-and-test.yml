# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: build-and-test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore src/Picross.Game/Picross.Game.csproj
    - name: Build
      run: dotnet build -c Release --no-restore src/Picross.Game/Picross.Game.csproj
      run: dotnet build -c Release --no-restore tests/Picross.Game.Tests/Picross.Game.Tests.csproj
    - name: Test
      run: dotnet test -c Release --no-build --verbosity normal tests/Picross.Game.Tests/Picross.Game.Tests.csproj
